<p>　　【共同社10月26日电】运用美军嘉手纳基地（日本冲绳县嘉手纳町等）的美空军第18航空团26日表示，已决定禁止中国汽车巨头比亚迪（BYD）的车辆进入基地。韩联社此前报道称，“可能意在阻断”通过车载摄像头等的信息泄露风险。</p>
