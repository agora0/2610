<p>　　【共同社10月1日电】关于涉嫌闯入东京都港区的中国驻日本大使馆而被控闯入建筑物、违反《枪刀法》等罪名的日本自卫队前三等陆尉村田晃大（24岁），他1日在东京地方法院的首次公审中承认了这两项起诉内容。对于另一项威胁大使馆职员的罪名，辩护方表示将进行争辩。</p>
