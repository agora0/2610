<p>　　【共同社10月4日电】关于一名美海军陆战队员因涉嫌抢劫杀人被逮捕一事，日本外相茂木敏充4日在外务省召见美国驻日大使格拉斯，提出强烈抗议称“极其遗憾”，要求美军整顿军纪、彻底防止类似事件再次发生。</p>
