<p>　　【共同社10月13日电】日本首相高市早苗13日出席众院预算委员会会议，对于农相簗和生能否继续任职一事表示：“如果相关发言属实，那确实不妥。包括该人是否适合开展行政运营在内，我将认真考虑。”</p>
