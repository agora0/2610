<p>　　【共同社10月30日电】日本总务省30日发布10月东京都23区消费者物价指数，剔除价格波动较大的生鲜食品的综合指数为103.3，较上年同期上升2.6%。升幅较9月的2.7%缩窄，但连续两个月达到2%以上。</p>
