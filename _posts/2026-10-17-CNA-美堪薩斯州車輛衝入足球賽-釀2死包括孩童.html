<p>（中央社華盛頓17日綜合外電報導）美國警方今天表示，一輛車衝入堪薩斯州威契塔（Wichita）一場足球賽事現場，造成兩人死亡，其中包括一名孩童，另有多人受傷；肇事駕駛已遭警方拘留。（編譯：<a class="author" href="https://www.cna.com.tw/author/0149/">洪培英</a>）1151018</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/56833/">#堪薩斯州</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/58237/">#孩童</a></div></div>
