<p>　　【共同社10月1日电】1日获悉，日中经济协会和日本经济团体联合会（经团联）、日本商工会议所一把手率领的代表团拟明年3月访问中国北京，已就此展开协调。由于日本首相高市早苗的涉台发言，原定今年1月的访华计划被推迟。</p>
