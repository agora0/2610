    <p>　　【共同社10月29日电】东京警视厅近日以伤害嫌疑逮捕了一名24岁的中国籍男大学生。该人涉嫌5月在东京银座的商业设施“GINZA SIX”内喷射喷雾，导致一名男子受伤。据警视厅透露，男大学生称不想说话，未表态是否认罪。</p>
