<p>　　【共同社10月8日电】据东京消防厅和办案相关人士称，8日下午5点半左右，东京霞关的日本外务省前发生两辆汽车相撞事故，4人受伤。其中一辆挂的可能是俄罗斯外交官车牌号。东京警视厅将调查详情。</p>
