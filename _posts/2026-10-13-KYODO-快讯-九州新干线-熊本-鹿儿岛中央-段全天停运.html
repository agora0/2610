<p>　　【共同社10月13日电】九州铁路公司（JR九州）13日发布消息称，由于陷入停运的九州新干线修复作业需要较长时间，“熊本-鹿儿岛中央”段全天停运。“博多-熊本”段的预计恢复时间改为下午5点。</p>
