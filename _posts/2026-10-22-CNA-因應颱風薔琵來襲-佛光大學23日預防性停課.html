<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0039/">沈如峰</a>宜蘭縣22日電）佛光大學今天表示，颱風薔琵逼近，考量學校位處宜蘭山區，為維護學生安全，明天預防性停課1天；職員出勤則依宜蘭縣政府停班停課公告及學校相關規定辦理。（編輯：陳清芳）1151022</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/8360/">#宜蘭</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/23369/">#佛光大學</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/28996/">#停班停課</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/59245/">#颱風薔琵</a></div></div>
