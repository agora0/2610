<p>　　【共同社10月4日电】今年第27号大型强台风“彩云”4日在东京的小笠原诸岛附近向北移动。预计今后将北上，日本气象厅称小笠原诸岛到6日为止将出现大浪和强风，呼吁民众提高警惕。预计该台风7日将在远离日本的东面减弱为温带低压。</p>
