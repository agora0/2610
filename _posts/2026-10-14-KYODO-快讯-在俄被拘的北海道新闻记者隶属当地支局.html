<p>　　【共同社莫斯科10月14日电】据俄媒报道，俄罗斯联邦安全局（FSB）在远东萨哈林州拘留的北海道新闻记者隶属该报南萨哈林斯克支局。莫斯科的法院已批准对这名因涉嫌从事间谍活动被拘的男性记者羁押两个月。</p>
