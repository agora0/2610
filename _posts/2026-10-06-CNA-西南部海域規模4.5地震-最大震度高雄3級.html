                      </picture><figcaption class="picinfo">6日下午4時41分高雄外海發生芮氏規模4.5地震。（圖取自氣象署網頁cwa.gov.tw）</figcaption></figure><p>（中央社台北6日電）根據中央氣象署最新資訊，6日16時41分發生芮氏規模4.5地震，地震深度34.1公里，震央位於高雄市政府南南西方42.4公里(位於臺灣西南部海域)，最大震度高雄市3級。（編輯：李亨山）1151006</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/28823/">#高雄市</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/28843/">#高雄市政府</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div></div>
