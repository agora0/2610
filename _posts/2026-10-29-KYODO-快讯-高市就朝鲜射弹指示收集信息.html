<p>　　【共同社10月29日电】由于朝鲜发射了可能为弹道导弹的飞行物，日本首相高市早苗29日指示相关政府部门，要求全力进行信息收集与分析工作，及时、准确地向国民发布相关信息，并彻底确认飞机和船舶的安全。据政府相关人士透露，该飞行物可能已落在日本专属经济区（EEZ）之外。</p>
