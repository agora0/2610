<p>　　【共同社10月4日电】冲绳县那霸市一家宾馆3日凌晨发现一名女性遗体。关于此案，该县警方4日以涉嫌抢劫杀人逮捕了一名隶属于美军普天间机场（宜野湾市）的海军陆战队士兵（20岁）。日本外务事务次官船越健裕当天致电美国驻日大使格拉斯，提出强烈抗议。</p>
