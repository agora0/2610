<p>　　【共同社10月16日电】日本首相高市早苗在参院预算委员会上被问及其历史认识时表示，“正如战后70周年谈话中宣布历代内阁的立场今后也将坚定不移，高市内阁也继承这一立场。”她表示其中当然也包括村山谈话。</p>
