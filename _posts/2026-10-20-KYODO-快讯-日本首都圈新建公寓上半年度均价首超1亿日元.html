<p>　　【共同社10月20日电】日本不动产经济研究所20日公布的数据显示，2026年4至9月的首都圈（1都3县）新建公寓每套平均价格为1.1494亿日元（约合人民币485万元），较上年同期上升21.1%。上半年度均价超过1亿日元尚属首次。</p>
