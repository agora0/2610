<p>　　【共同社莫斯科10月14日电】据俄新社报道，俄罗斯联邦安全局（FSB）13日发布消息称，在远东萨哈林州拘留了北海道新闻的记者。据称，该记者收集有关俄罗斯国防能力的信息，已将其移送至莫斯科并实施逮捕。</p>
