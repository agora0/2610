    <p>　　【共同社10月14日电】日本农相簗和生14日与首相高市早苗在官邸会面，表示有意辞职。除了削减地方政府公路预算的发言之外，在选举中用免费巴士接送支持者涉嫌违反《公职选举法》一事也被曝光，招致混乱，簗和生意在承担责任。</p>
