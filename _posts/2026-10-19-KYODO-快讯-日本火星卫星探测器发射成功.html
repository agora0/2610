<p>　　【共同社10月20日电】日本宇宙航空研究开发机构（JAXA）20日用H3火箭10号机，从鹿儿岛县的种子岛宇宙中心发射了火星卫星探测计划“MMX”探测器。JAXA宣布已将探测器正常分离，使其进入轨道。此次发射取得成功。</p>
