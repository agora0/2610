<p>　　【共同社10月2日电】日本总务省2日发布9月东京都23区消费者物价指数，剔除价格波动较大的生鲜食品的综合指数为102.6，较去年同期上升2.7%。升幅较8月的1.8%扩大，8个月来首次达到2%以上。</p>
