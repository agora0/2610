<p>　　【共同社10月18日电】日本共同社的舆论调查结果显示，对于前农相簗和生辞职一事，回答称“理所当然”的受访者占81.5%，认为“没必要辞职”的占11.1%。关于首相高市早苗撤换簗和生的做法，57.7%的人认为“太迟”，认为“妥当”的占25.7%。</p>
