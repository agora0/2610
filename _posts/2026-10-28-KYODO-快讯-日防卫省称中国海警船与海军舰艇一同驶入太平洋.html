<p>　　【共同社10月28日电】日本防卫省28日发布消息称，确认有3艘中国海军舰艇和1艘中国海警船27日从鹿儿岛县近海的大隅海峡驶向太平洋。这是防卫省首次公布中国海警船和海军舰艇一同通过海峡等的消息。</p>
