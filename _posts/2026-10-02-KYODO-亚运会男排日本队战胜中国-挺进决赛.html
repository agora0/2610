    <p>　　【共同社10月2日电】爱知·名古屋亚运会2日举行男排半决赛，日本队以3比2险胜上届亚军中国队，时隔两届赛事挺进决赛。日本队将在3日的决赛中对阵伊朗队，力争时隔三届赛事再夺金牌。</p>
