<p>　　【共同社10月1日电】1日下午2点左右在日本山口县下关市的海上自卫队小月航空基地，一架起落架无法放下的隶属该基地T-5教练机在跑道实施了机腹着陆。基地方面表示，当时机上有1名教官，为监控飞行训练而登机操纵。此次无人受伤。目前正在调查原因。</p>
