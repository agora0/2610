<p>（中央社台北22日電）根據中國地震台網的資訊，今天晚間10時33分，西藏那曲市巴青縣發生規模7地震，震源深度10公里。</p><p>據中國地震台網資料，震央周邊200公里內近5年來發生3級以上地震共54次。（編輯：<a class="author" href="https://www.cna.com.tw/author/0073/">周慧盈</a>/陳彥鈞）1151022</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4202/">#中國地震台網</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/23359/">#西藏</a></div></div>
