    <p>　　【共同社10月16日电】日本东海铁路公司（JR东海）16日受通知称“从北海道至东海地区将发生强烈摇晃”的紧急地震速报影响，防灾系统启动，于当天中午12点40分左右暂停了东海道新干线“新横滨-丰桥”段上下行线路的运行。速报随后被取消，列车在中午12点55分左右恢复了运行。</p>
