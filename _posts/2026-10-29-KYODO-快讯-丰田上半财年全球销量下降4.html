<p>　　【共同社10月29日电】丰田汽车公司29日公布的2026上半财年（4月至9月）全球销量为505万辆，较去年同期下降4.0%，时隔一年再次低于上年同期。中国市场销售低迷造成了影响。全球产量减少1.9%至489万辆。</p>
