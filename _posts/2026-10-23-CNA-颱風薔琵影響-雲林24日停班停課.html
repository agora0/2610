<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0069/">姜宜菁</a>雲林縣23日電）雲林縣政府表示，依交通部中央氣象署今天發布颱風薔琵警報資料，雲林明天風力預測已達停止上班、停止上課標準，為確保民眾安全，雲林明天停班停課。（編輯：李明宗）1151023</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/16101/">#雲林縣政府</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/22553/">#交通部</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/28996/">#停班停課</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/59245/">#颱風薔琵</a></div></div>
