    <p>　　【共同社10月27日电】围绕GMO互联网集团遭非法访问的问题，疑似来自攻击者的声明27日在网上被公开。其中称GMO未答应交涉，并公布了部分据称是客户个人信息的内容。多名网络安全相关人士透露了这一消息。</p>
