<p>　　【共同社莫斯科10月13日电】俄罗斯远东萨哈林州13日发布消息称，中国黑龙江省的代表团访问了俄有效控制的北方四岛中的择捉岛。日本政府或许会基于“按照俄方手续进入北方四岛是不可接受的”这一立场表示反对。</p>
