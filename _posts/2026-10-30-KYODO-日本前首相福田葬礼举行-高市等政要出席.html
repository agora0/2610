<p>　　【共同社10月30日电】22日去世的日本前首相福田康夫（享年90岁）的葬礼30日在东京南青山的青山葬仪所举行。首相高市早苗、前首相野田佳彦、自民党代理干事长萩生田光一等人出席，向福田作了最后告别。</p>
