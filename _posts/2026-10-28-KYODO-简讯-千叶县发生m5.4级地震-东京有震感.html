    <p>　　【共同社10月29日电】29日凌晨0点07分左右，在千叶县观测到震度5弱（日本标准）的地震。气象厅表示，震源位于千叶县东北部，震源深度约为50千米，估测震级为M5.4级。该地震不会引发海啸。东京有震感。</p>
