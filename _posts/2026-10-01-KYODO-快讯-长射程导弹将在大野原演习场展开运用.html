<p>　　【共同社10月1日电】日本防卫省1日透露称，在本月实施的日美联合综合演习“利剑”中，已决定把陆上自卫队的长射程导弹“25式陆基反舰导弹”在跨长崎和佐贺两县的大野原演习场展开运用。</p>
