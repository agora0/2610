<p>　　【共同社10月12日电】日本防卫副大臣小鑓隆史12日就朝鲜发射弹道导弹一事指出，此举违反联合国安理会决议，政府已通过外交渠道提出严正抗议，并予以强烈谴责。据悉目前尚未发现此次射弹造成损失。</p>
