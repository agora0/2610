<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0025/">蔡智明</a>嘉義縣22日電）嘉義縣政府今晚宣布，依據中央氣象署薔琵颱風警報暨最新發布風力預測資訊，明天已達停班課標準，為維護縣民安全及準備各項應變作為，嘉義縣明天停止上班、停止上課。（編輯：蕭博文）1151022</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/33677/">#嘉義縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/37744/">#停班課</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/59303/">#薔琵颱風</a></div></div>
