<p>　　【共同社10月14日电】日本外务省14日就俄罗斯有关部门宣布在远东萨哈林州拘留了北海道新闻一名男性记者一事，召见俄罗斯驻日大使诺兹德列夫。日方可能要求俄方提供相关信息并给予人道关照。</p>
