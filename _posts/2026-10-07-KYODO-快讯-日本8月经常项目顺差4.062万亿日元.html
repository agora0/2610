<p>　　【共同社10月8日电】日本财务省8日公布的8月国际收支初值显示，反映与海外货物、服务及投资交易状况的经常项目顺差为4.062万亿日元（约合人民币1721亿元）。经常项目连续19个月呈现顺差。</p>
