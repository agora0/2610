<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0063/">李卉婷</a>屏東縣22日電）颱風薔琵來襲，屏東縣政府今天表示，依中央氣象署最新氣象預報資料，屏東縣明天風力預測已達停止上班及停止上課標準，為確保民眾生命財產安全，宣布明天全縣停止上班、停止上課。（編輯：蕭博文）1151022</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/10754/">#屏東縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/59245/">#颱風薔琵</a></div></div>
